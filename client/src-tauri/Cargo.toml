[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.79.0"

[build-dependencies]
tauri-build = { version = "1.5.3", features = [] }

[dependencies]
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.7.0", features = [ "fs-write-file", "fs-read-file", "fs-create-dir", "fs-exists",
    "shell-sidecar",
    "path-all",
    "window-all",
    "system-tray",
    "process-command-api",
] }
reqwest = { version = "0.12.9", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
# WebSocket client for Supabase Realtime (Phoenix channel protocol)
tungstenite = { version = "0.24", features = ["native-tls"] }
# Cross-platform app data directory resolution (macOS, Windows, Linux)
directories = "5.0"

[features]
# DO NOT REMOVE — used for production/static builds
custom-protocol = ["tauri/custom-protocol"]
